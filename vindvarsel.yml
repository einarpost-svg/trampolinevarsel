name: Vindvarsel trampoline

on:
  schedule:
    # Kjører kl. 06:00, 12:00 og 18:00 norsk tid (UTC+1/+2)
    # GitHub Actions bruker UTC, så vi legger inn litt margin for begge årstider
    - cron: "0 5,11,17 * * *"
  workflow_dispatch: {}  # lar deg trigge manuelt fra "Actions"-fanen på GitHub

permissions:
  contents: write  # trengs for å committe state.json tilbake til repoet

jobs:
  sjekk-vind:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests

      - name: Kjør vindsjekk
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python vindvarsel.py

      - name: Lagre oppdatert state (dedupe-fil)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "vindvarsel-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "Oppdater state etter vindsjekk [skip ci]"
            git push
          else
            echo "Ingen endring i state.json, hopper over commit."
          fi
